<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой Wishlist</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #f4f4f5);
            color: var(--tg-theme-text-color, #000000);
            margin: 0; padding: 16px;
            transition: background-color 0.3s, color 0.3s;
        }

        h2 { text-align: center; margin-top: 0; margin-bottom: 20px;}

        /* Форма добавления товара */
        .add-form {
            display: flex; gap: 8px; margin-bottom: 24px;
        }
        .add-input {
            flex: 1; padding: 12px; border-radius: 12px;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            outline: none;
        }
        .add-btn {
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #fff);
            border: none; padding: 12px 20px; border-radius: 12px;
            font-weight: bold; cursor: pointer;
        }

        /* Сетка товаров */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2 колонки на телефоне */
            gap: 12px;
        }

        .card {
            background-color: var(--tg-theme-secondary-bg-color, #ffffff);
            border-radius: 16px; overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: flex; flex-direction: column;
            position: relative;
        }

        .card-img {
            width: 100%; height: 160px; object-fit: cover;
            background-color: #eee;
        }

        .card-body { padding: 12px; display: flex; flex-direction: column; flex: 1; }
        
        .card-title {
            font-size: 14px; font-weight: 600; margin-bottom: 12px;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden; text-overflow: ellipsis;
        }

        .buy-btn {
            margin-top: auto; display: block; text-align: center;
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #fff);
            text-decoration: none; padding: 8px; border-radius: 10px;
            font-size: 13px; font-weight: bold;
        }

        .delete-btn {
            position: absolute; top: 8px; right: 8px;
            background: rgba(255, 255, 255, 0.9); border: none;
            width: 30px; height: 30px; border-radius: 15px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            color: red;
        }

        #loading { text-align: center; margin-top: 50px; font-weight: bold; color: var(--tg-theme-hint-color); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <h2>Мои Желания 🎁</h2>

    <!-- Форма для ручного добавления ссылок -->
    <div class="add-form">
        <input type="text" id="link-input" class="add-input" placeholder="Вставьте ссылку на товар...">
        <button class="add-btn" onclick="addNewItem()">➕</button>
    </div>

    <div id="loading">Загружаем ваши хотелки... ⏳</div>
    
    <!-- Контейнер для карточек -->
    <div id="wishlist-grid" class="grid hidden"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.setHeaderColor('bg_color');

        // ВАЖНО: Вставьте сюда вашу ссылку на Render (без слэша на конце)
        const API_URL = "https://hotelochkki.onrender.com"; 

        // Получаем ID пользователя из Telegram (или ставим заглушку для теста в браузере)
        const userId = tg.initDataUnsafe?.user?.id || 123456789;

        // Загрузка товаров при открытии приложения
        async function fetchWishlist() {
            try {
                const response = await fetch(`${API_URL}/api/wishlist/${userId}`);
                const items = await response.json();
                renderItems(items);
            } catch (error) {
                console.error("Ошибка загрузки:", error);
                document.getElementById('loading').innerText = "Ошибка загрузки 😔";
            }
        }

        // Отрисовка товаров на экране
        function renderItems(items) {
            const grid = document.getElementById('wishlist-grid');
            const loading = document.getElementById('loading');
            
            grid.innerHTML = '';
            
            if (items.length === 0) {
                loading.innerText = "Ваш список пока пуст 🛍\nОтправьте ссылку боту или добавьте её выше.";
                loading.classList.remove('hidden');
                grid.classList.add('hidden');
                return;
            }

            loading.classList.add('hidden');
            grid.classList.remove('hidden');

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <button class="delete-btn" onclick="deleteItem(${item.id})">🗑</button>
                    <img src="${item.image_url}" alt="Фото товара" class="card-img" onerror="this.src='https://via.placeholder.com/300x300?text=Нет+фото'">
                    <div class="card-body">
                        <div class="card-title">${item.title}</div>
                        <a href="${item.url}" target="_blank" class="buy-btn">Перейти к товару</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Добавление нового товара прямо из приложения
        async function addNewItem() {
            const input = document.getElementById('link-input');
            const url = input.value.trim();
            
            if (!url) return tg.showAlert("Сначала вставьте ссылку!");
            if (!url.startsWith('http')) return tg.showAlert("Ссылка должна начинаться с http или https");

            tg.MainButton.text = "Сохраняем...";
            tg.MainButton.showProgress();
            tg.MainButton.show();

            try {
                const response = await fetch(`${API_URL}/api/wishlist`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, url: url })
                });

                if (response.ok) {
                    input.value = '';
                    tg.HapticFeedback.notificationOccurred('success');
                    fetchWishlist(); // Перезагружаем список
                } else {
                    tg.showAlert("Ошибка при сохранении");
                }
            } catch (error) {
                tg.showAlert("Ошибка сети");
            } finally {
                tg.MainButton.hide();
            }
        }

        // Удаление товара
        async function deleteItem(itemId) {
            // Спрашиваем подтверждение
            tg.showConfirm("Точно удалить этот товар?", async (confirmed) => {
                if (confirmed) {
                    try {
                        const response = await fetch(`${API_URL}/api/wishlist/${itemId}`, { method: 'DELETE' });
                        if (response.ok) {
                            tg.HapticFeedback.impactOccurred('light');
                            fetchWishlist(); // Обновляем список
                        }
                    } catch (error) {
                        tg.showAlert("Ошибка при удалении");
                    }
                }
            });
        }

        // Запускаем загрузку данных при старте
        fetchWishlist();
    </script>
</body>
</html>
