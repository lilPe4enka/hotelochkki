<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой Wishlist</title>
    <!-- Подключаем скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Базовые цвета подстраиваются под тему Telegram пользователя */
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #000000);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --link-color: var(--tg-theme-link-color, #2481cc);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --card-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header h2 { margin: 0; font-size: 22px; }

        .update-btn {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .update-btn:disabled { opacity: 0.5; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .card.purchased { opacity: 0.5; }

        .card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            background-color: #fff;
        }

        .card-info {
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .title {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .price {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 10px;
            color: var(--button-color);
        }

        .price.out-of-stock {
            color: #ff3b30;
            font-size: 14px;
        }

        .buy-btn {
            text-align: center;
            background-color: transparent;
            color: var(--button-color);
            border: 1px solid var(--button-color);
            text-decoration: none;
            padding: 6px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            margin-top: auto;
            margin-bottom: 8px;
            display: block;
        }

        /* НОВЫЙ ДИЗАЙН КНОПОК УПРАВЛЕНИЯ */
        .controls {
            display: flex;
            gap: 6px;
        }

        .controls button {
            padding: 6px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-toggle {
            background-color: #34c759;
            color: white;
            flex: 1; /* Растягивается на свободное место */
        }

        .btn-edit {
            background-color: #ff9500;
            color: white;
            flex: 0 0 32px; /* Фиксированная ширина для иконки */
            font-size: 14px;
        }

        .btn-delete {
            background-color: #ff3b30;
            color: white;
            flex: 0 0 32px; /* Фиксированная ширина для иконки */
            font-size: 14px;
        }

        .empty-state {
            text-align: center;
            color: var(--hint-color);
            margin-top: 50px;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2 id="pageTitle">Мои желания 🎁</h2>
        <button id="updatePricesBtn" class="update-btn" onclick="updateAllPrices()" style="display: none;">
            🔄 Обновить цены
        </button>
    </div>

    <div id="wishlist" class="grid">
        <div class="empty-state">⏳ Загружаю товары...</div>
    </div>

    <script>
        // === НАСТРОЙКИ ===
        // Вставьте сюда вашу ссылку на Render БЕЗ слэша на конце!
        const RENDER_URL = "https://hotelochkki.onrender.com"; 
        
        const tg = window.Telegram.WebApp;
        tg.expand(); 

        const urlParams = new URLSearchParams(window.location.search);
        const guestId = urlParams.get('guest_id');
        const myId = tg.initDataUnsafe?.user?.id || 123456789; 
        
        const targetUserId = guestId ? guestId : myId;
        const isOwner = !guestId || (guestId == myId);

        let currentItems = []; // Сюда сохраняем загруженные товары для редактирования

        if (!isOwner) {
            document.getElementById('pageTitle').innerText = "Витрина желаний 🎁";
        } else {
            document.getElementById('updatePricesBtn').style.display = 'block';
        }

        async function loadWishlist() {
            try {
                const response = await fetch(`${RENDER_URL}/api/wishlist/${targetUserId}`);
                if (!response.ok) throw new Error("Ошибка сервера");
                
                currentItems = await response.json();
                renderItems(currentItems);
            } catch (error) {
                console.error(error);
                document.getElementById('wishlist').innerHTML = `<div class="empty-state">❌ Ошибка подключения. Сервер спит или недоступен.</div>`;
            }
        }

        function renderItems(items) {
            const container = document.getElementById('wishlist');
            container.innerHTML = '';

            if (items.length === 0) {
                container.innerHTML = `<div class="empty-state">Тут пока пусто 😔<br><br>Отправьте боту ссылку на товар!</div>`;
                return;
            }

            items.forEach(item => {
                let priceHtml = '';
                if (item.price === "Нет в наличии") {
                    priceHtml = `<div class="price out-of-stock">Нет в наличии</div>`;
                } else if (item.price && item.price !== "Цена не найдена") {
                    priceHtml = `<div class="price">${item.price}</div>`;
                } else if (item.price === "Цена не найдена") {
                    priceHtml = `<div class="price" style="font-size: 13px; color: #999;">Цена не найдена</div>`;
                }

                // ДОБАВЛЕНА КНОПКА РЕДАКТИРОВАНИЯ (✏️)
                let controlsHtml = '';
                if (isOwner) {
                    controlsHtml = `
                        <div class="controls">
                            <button class="btn-toggle" onclick="togglePurchased(${item.id}, ${item.is_purchased})">
                                ${item.is_purchased ? '🔙' : '🎁'}
                            </button>
                            <button class="btn-edit" onclick="editTitle(${item.id})">✏️</button>
                            <button class="btn-delete" onclick="deleteItem(${item.id})">🗑</button>
                        </div>
                    `;
                }

                const purchasedClass = item.is_purchased ? 'purchased' : '';

                container.innerHTML += `
                    <div class="card ${purchasedClass}">
                        <img src="${item.image_url}" alt="Фото">
                        <div class="card-info">
                            <div class="title">${item.title}</div>
                            ${priceHtml}
                            <a href="${item.url}" target="_blank" class="buy-btn">🔗 Открыть магазин</a>
                            ${controlsHtml}
                        </div>
                    </div>
                `;
            });
        }

        // НОВАЯ ФУНКЦИЯ: Смена названия
        async function editTitle(itemId) {
            const item = currentItems.find(i => i.id === itemId);
            if (!item) return;

            // Вызываем стандартное окно ввода текста
            const newTitle = window.prompt("Введите новое название для этого товара:", item.title);
            
            // Если пользователь нажал "ОК" и ввел не пустой текст
            if (newTitle !== null && newTitle.trim() !== "") {
                tg.HapticFeedback.impactOccurred('light');
                
                try {
                    await fetch(`${RENDER_URL}/api/wishlist/${itemId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ title: newTitle.trim() }) // Отправляем новое название на сервер
                    });
                    loadWishlist(); // Обновляем витрину
                } catch (e) {
                    tg.showAlert("Не удалось сохранить название. Попробуйте еще раз.");
                }
            }
        }

        async function deleteItem(itemId) {
            if (!confirm("Точно удалить?")) return;
            tg.HapticFeedback.impactOccurred('medium');
            try {
                await fetch(`${RENDER_URL}/api/wishlist/${itemId}`, { method: 'DELETE' });
                loadWishlist(); 
            } catch (e) {
                alert("Ошибка при удалении");
            }
        }

        async function togglePurchased(itemId, currentStatus) {
            tg.HapticFeedback.impactOccurred('light');
            const newStatus = currentStatus === 1 ? 0 : 1;
            try {
                await fetch(`${RENDER_URL}/api/wishlist/${itemId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ is_purchased: newStatus })
                });
                loadWishlist();
            } catch (e) {
                alert("Ошибка обновления статуса");
            }
        }

        async function updateAllPrices() {
            const btn = document.getElementById("updatePricesBtn");
            btn.innerHTML = "⏳ Обновляю...";
            btn.disabled = true;
            tg.HapticFeedback.impactOccurred('rigid');

            try {
                const response = await fetch(`${RENDER_URL}/api/wishlist/update-prices/${targetUserId}`, { method: 'POST' });
                if (response.ok) {
                    const data = await response.json();
                    tg.showAlert(`Успешно! Обновлены цены для ${data.updated_count} товаров.`);
                    loadWishlist();
                } else {
                    tg.showAlert("Ошибка при обновлении цен.");
                }
            } catch (error) {
                tg.showAlert("Не удалось связаться с сервером.");
            } finally {
                btn.innerHTML = "🔄 Обновить цены";
                btn.disabled = false;
            }
        }

        loadWishlist();
    </script>
</body>
</html>
