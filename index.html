<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой Wishlist</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #f4f4f5);
            color: var(--tg-theme-text-color, #000000);
            margin: 0; padding: 16px; padding-bottom: 80px;
        }

        h2 { text-align: center; margin-top: 0; margin-bottom: 16px;}

        .tabs {
            display: flex; overflow-x: auto; gap: 8px; margin-bottom: 20px;
            padding-bottom: 8px; scrollbar-width: none;
        }
        .tabs::-webkit-scrollbar { display: none; }
        .tab {
            padding: 8px 16px; border-radius: 20px; white-space: nowrap;
            background: var(--tg-theme-secondary-bg-color, #e0e0e0);
            color: var(--tg-theme-hint-color, #666);
            font-weight: bold; font-size: 14px; cursor: pointer; border: none;
        }
        .tab.active { background: var(--tg-theme-button-color, #3390ec); color: #fff; }

        .add-form { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
        .add-input {
            flex: 1; min-width: 150px; padding: 12px; border-radius: 12px;
            border: 1px solid var(--tg-theme-hint-color, #ccc); background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); outline: none;
        }
        .cat-select {
            padding: 12px; border-radius: 12px; border: 1px solid var(--tg-theme-hint-color, #ccc); background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000);
        }
        .add-btn {
            background-color: var(--tg-theme-button-color, #3390ec); color: #fff;
            border: none; padding: 12px 20px; border-radius: 12px; font-weight: bold; cursor: pointer;
        }

        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }

        .card {
            background-color: var(--tg-theme-secondary-bg-color, #ffffff);
            border-radius: 16px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: flex; flex-direction: column; position: relative; transition: opacity 0.3s;
        }
        .card.purchased { opacity: 0.6; filter: grayscale(50%); }

        .card-img { width: 100%; height: 150px; object-fit: cover; background-color: #eee; }
        .card-body { padding: 12px; display: flex; flex-direction: column; flex: 1; gap: 8px; }
        
        .card-title {
            font-size: 14px; font-weight: 600;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis;
        }
        .card.purchased .card-title { text-decoration: line-through; }

        .card-actions { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; z-index: 10; }
        .action-btn {
            background: rgba(255, 255, 255, 0.9); border: none; width: 30px; height: 30px; border-radius: 15px;
            display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        .priority-btn {
            position: absolute; top: 8px; left: 8px; z-index: 10;
            background: rgba(255, 255, 255, 0.9); border: none; width: 32px; height: 32px; border-radius: 16px;
            font-size: 16px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2); filter: grayscale(100%);
        }
        .priority-btn.active { filter: grayscale(0%); background: #fff0d4; border: 1px solid #ff9800; }

        /* Бейджик для гостя (вместо кликабельного огонька) */
        .guest-badge {
            position: absolute; top: 8px; right: 8px; background: rgba(255,152,0,0.9);
            color: white; padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: bold;
        }

        .checkbox-container { position: absolute; top: 48px; left: 12px; z-index: 10; }
        .item-checkbox { width: 20px; height: 20px; accent-color: var(--tg-theme-button-color, #3390ec); }

        .buy-btn, .bought-btn {
            text-align: center; border: none; color: #fff; text-decoration: none;
            padding: 8px; border-radius: 10px; font-size: 13px; font-weight: bold; cursor: pointer;
        }
        .buy-btn { background-color: var(--tg-theme-button-color, #3390ec); flex: 1; }
        .bought-btn { background-color: #4CAF50; }
        .buttons-row { display: flex; gap: 6px; margin-top: auto; }

        .mini-select {
            width: 100%; padding: 4px; border-radius: 6px; border: 1px solid #ddd;
            font-size: 11px; background: transparent; color: var(--tg-theme-hint-color);
        }

        .share-bar {
            position: fixed; bottom: 16px; left: 16px; right: 16px;
            display: flex; justify-content: center; z-index: 100; transition: transform 0.3s ease, opacity 0.3s ease;
        }
        .share-bar.hidden { transform: translateY(100px); opacity: 0; pointer-events: none; }
        .share-btn {
            background-color: var(--tg-theme-button-color, #3390ec); color: #fff;
            padding: 16px; border-radius: 14px; border: none; font-weight: bold; font-size: 16px; width: 100%;
            box-shadow: 0 4px 15px rgba(51, 144, 236, 0.4); cursor: pointer;
        }

        #loading { text-align: center; margin-top: 50px; font-weight: bold; color: var(--tg-theme-hint-color); }
        .hidden-element { display: none !important; }
    </style>
</head>
<body>

    <h2 id="main-title">Мои Желания 🎁</h2>

    <div class="tabs" id="category-tabs">
        <button class="tab active" onclick="setCategory('Все')">Все</button>
        <button class="tab" onclick="setCategory('Одежда')">Одежда</button>
        <button class="tab" onclick="setCategory('Техника')">Техника</button>
        <button class="tab" onclick="setCategory('Для дома')">Для дома</button>
        <button class="tab" onclick="setCategory('Подарки')">Подарки</button>
        <button class="tab" onclick="setCategory('Куплено')">Куплено ✅</button>
    </div>

    <!-- Контейнер формы добавления -->
    <div class="add-form" id="add-form-container">
        <input type="text" id="link-input" class="add-input" placeholder="Вставьте ссылку...">
        <select id="new-cat-select" class="cat-select">
            <option value="Одежда">Одежда</option>
            <option value="Техника">Техника</option>
            <option value="Для дома">Для дома</option>
            <option value="Подарки">Подарки</option>
            <option value="Остальное" selected>Остальное</option>
        </select>
        <button class="add-btn" onclick="addNewItem()">➕</button>
    </div>

    <div id="loading">Загружаем хотелки... ⏳</div>
    <div id="wishlist-grid" class="grid hidden-element"></div>

    <div id="share-bar" class="share-bar hidden">
        <button class="share-btn" onclick="shareSelected()">Отправить в чат (0)</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand(); tg.setHeaderColor('bg_color');

        // ВАЖНО: Вставьте сюда вашу ссылку на Render
        const API_URL = "https://hotelochkki.onrender.com"; 
        
        // Магия режима Гостя
        const urlParams = new URLSearchParams(window.location.search);
        const guestId = urlParams.get('guest_id');
        const isGuestMode = !!guestId; // Если guestId есть, значит режим гостя включен
        
        const userId = isGuestMode ? guestId : (tg.initDataUnsafe?.user?.id || 123456789);

        let allItems = [];
        let currentCategory = 'Все';

        // Настраиваем интерфейс в зависимости от того, кто открыл приложение
        if (isGuestMode) {
            document.getElementById('main-title').innerText = "Витрина желаний 🎁";
            document.getElementById('add-form-container').classList.add('hidden-element');
            document.getElementById('share-bar').classList.add('hidden-element');
        }

        async function fetchWishlist() {
            try {
                const response = await fetch(`${API_URL}/api/wishlist/${userId}`);
                allItems = await response.json();
                renderItems();
                if (!isGuestMode) updateShareButton();
            } catch (error) {
                document.getElementById('loading').innerText = "Ошибка загрузки 😔";
            }
        }

        function setCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.tab').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.includes(cat) || btn.innerText === cat);
            });
            
            if (!isGuestMode) {
                const addForm = document.getElementById('add-form-container');
                if (cat === 'Куплено') addForm.classList.add('hidden-element');
                else addForm.classList.remove('hidden-element');
            }
            renderItems();
        }

        function renderItems() {
            const grid = document.getElementById('wishlist-grid');
            const loading = document.getElementById('loading');
            grid.innerHTML = '';

            let filtered = allItems;
            if (currentCategory === 'Куплено') {
                filtered = allItems.filter(item => item.is_purchased === 1);
            } else {
                filtered = allItems.filter(item => item.is_purchased === 0);
                if (currentCategory !== 'Все') {
                    filtered = filtered.filter(item => item.category === currentCategory);
                }
            }

            if (filtered.length === 0) {
                loading.innerText = currentCategory === 'Куплено' ? "Здесь будут сбывшиеся мечты ✨" : "В этой категории пока пусто 🛍";
                loading.classList.remove('hidden-element');
                grid.classList.add('hidden-element');
                return;
            }

            loading.classList.add('hidden-element');
            grid.classList.remove('hidden-element');

            filtered.sort((a, b) => b.is_priority - a.is_priority);

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = `card ${item.is_purchased ? 'purchased' : ''}`;
                
                if (isGuestMode) {
                    // РЕЖИМ ГОСТЯ: Только красивая карточка с кнопкой перехода, без элементов управления
                    card.innerHTML = `
                        ${item.is_priority && !item.is_purchased ? '<div class="guest-badge">🔥 Очень хочу</div>' : ''}
                        <img src="${item.image_url}" class="card-img" onerror="this.src='https://via.placeholder.com/300x300?text=Нет+фото'">
                        <div class="card-body">
                            <div class="card-title">${item.title}</div>
                            <div style="font-size: 11px; color: var(--tg-theme-hint-color); margin-bottom: 8px;">Категория: ${item.category}</div>
                            <a href="${item.url}" target="_blank" class="buy-btn">Смотреть в магазине</a>
                        </div>
                    `;
                } else {
                    // РЕЖИМ ВЛАДЕЛЬЦА: Полный функционал, как было раньше
                    const safeTitle = (item.title || "").replace(/'/g, "&apos;").replace(/"/g, "&quot;");
                    const categories = ['Одежда', 'Техника', 'Для дома', 'Подарки', 'Остальное'];
                    let catOptions = categories.map(c => `<option value="${c}" ${item.category === c ? 'selected' : ''}>${c}</option>`).join('');

                    card.innerHTML = `
                        ${item.is_purchased ? '' : `
                            <button class="priority-btn ${item.is_priority ? 'active' : ''}" onclick="togglePriority(${item.id}, ${item.is_priority})">🔥</button>
                            <div class="checkbox-container"><input type="checkbox" class="item-checkbox" data-url="${item.url}" onchange="updateShareButton()"></div>
                        `}
                        <div class="card-actions">
                            <button class="action-btn" onclick="editItem(${item.id}, '${safeTitle}')">✏️</button>
                            <button class="action-btn" style="color: red;" onclick="deleteItem(${item.id})">🗑</button>
                        </div>
                        <img src="${item.image_url}" class="card-img" onerror="this.src='https://via.placeholder.com/300x300?text=Нет+фото'">
                        <div class="card-body">
                            <div class="card-title">${item.title}</div>
                            ${item.is_purchased ? '' : `<select class="mini-select" onchange="changeCategory(${item.id}, this.value)">${catOptions}</select>`}
                            <div class="buttons-row">
                                <a href="${item.url}" target="_blank" class="buy-btn">Ссылка</a>
                                <button class="bought-btn" onclick="togglePurchased(${item.id}, ${item.is_purchased})">
                                    ${item.is_purchased ? 'Вернуть' : 'Куплено ✅'}
                                </button>
                            </div>
                        </div>
                    `;
                }
                grid.appendChild(card);
            });
        }

        async function updateField(itemId, fieldName, value) {
            tg.HapticFeedback.selectionChanged();
            try {
                const body = {}; body[fieldName] = value;
                await fetch(`${API_URL}/api/wishlist/${itemId}`, {
                    method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
                });
                fetchWishlist();
            } catch (error) {}
        }

        function togglePriority(id, current) { updateField(id, 'is_priority', current ? 0 : 1); }
        function togglePurchased(id, current) { 
            if(!current) tg.HapticFeedback.notificationOccurred('success');
            updateField(id, 'is_purchased', current ? 0 : 1); 
        }
        function changeCategory(id, newCat) { updateField(id, 'category', newCat); }

        function updateShareButton() {
            if (isGuestMode) return;
            const checkboxes = document.querySelectorAll('.item-checkbox:checked');
            const shareBar = document.getElementById('share-bar');
            const shareBtn = shareBar.querySelector('.share-btn');
            if (checkboxes.length > 0) {
                shareBtn.innerText = `Отправить в чат (${checkboxes.length})`;
                shareBar.classList.remove('hidden');
            } else {
                shareBar.classList.add('hidden');
            }
        }

        function shareSelected() {
            const checkboxes = document.querySelectorAll('.item-checkbox:checked');
            if (checkboxes.length === 0) return;
            let text = "Смотри, что я хочу 🎁:\n\n";
            checkboxes.forEach((cb, i) => { text += `${i + 1}. ${cb.dataset.url}\n`; });
            const shareUrl = `https://t.me/share/url?text=${encodeURIComponent(text)}`;
            try { tg.openTelegramLink(shareUrl); } catch (e) { window.location.href = shareUrl; }
        }

        async function editItem(itemId, currentTitle) {
            const newTitle = prompt("Новое название:", currentTitle);
            if (newTitle && newTitle.trim() !== "" && newTitle !== currentTitle) {
                updateField(itemId, 'title', newTitle.trim());
            }
        }

        async function addNewItem() {
            const url = document.getElementById('link-input').value.trim();
            const cat = document.getElementById('new-cat-select').value;
            if (!url) return tg.showAlert("Сначала вставьте ссылку!");
            
            tg.MainButton.text = "Сохраняем..."; tg.MainButton.showProgress(); tg.MainButton.show();
            try {
                const response = await fetch(`${API_URL}/api/wishlist`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, url: url })
                });
                if (response.ok) {
                    const data = await response.json();
                    await fetch(`${API_URL}/api/wishlist/${data.id}`, {
                        method: 'PUT', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ category: cat })
                    });
                    
                    document.getElementById('link-input').value = '';
                    tg.HapticFeedback.notificationOccurred('success');
                    fetchWishlist();
                }
            } catch (error) {} finally { tg.MainButton.hide(); }
        }

        async function deleteItem(itemId) {
            tg.showConfirm("Удалить товар?", async (confirmed) => {
                if (confirmed) {
                    await fetch(`${API_URL}/api/wishlist/${itemId}`, { method: 'DELETE' });
                    tg.HapticFeedback.impactOccurred('light');
                    fetchWishlist();
                }
            });
        }

        fetchWishlist();
    </script>
</body>
</html>
